name: Publicera till GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Låt en pågående publicering bli klar i stället för att avbryta den.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicera:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true slår på Pages för repot om det inte redan är på,
      # så sidan går live utan att någon behöver klicka i inställningarna.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
